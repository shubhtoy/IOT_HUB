<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Access Control</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            background: linear-gradient(135deg, #121212, #1e1e1e);
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background-color: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: min(30px, 5vh);
            text-align: center;
            margin: 20px;
        }

        .title {
            color: #bb86fc;
            font-size: clamp(20px, 5vw, 24px);
            margin-bottom: min(30px, 4vh);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .unlock-button {
            width: min(200px, 60vw);
            height: min(200px, 60vw);
            border-radius: 50%;
            background: linear-gradient(145deg, #bb86fc, #9b6ce0);
            border: none;
            color: #ffffff;
            font-size: clamp(16px, 4vw, 20px);
            cursor: pointer;
            margin: min(20px, 3vh) auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(187, 134, 252, 0.3);
            -webkit-touch-callout: none;
            user-select: none;
        }

        .unlock-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(187, 134, 252, 0.4);
        }

        .unlock-button:active {
            transform: scale(0.95);
        }

        .unlock-button i {
            font-size: clamp(36px, 8vw, 48px);
            margin-bottom: 10px;
        }

        .status {
            background-color: #2c2c2c;
            padding: min(15px, 3vh);
            border-radius: 8px;
            margin-top: min(20px, 3vh);
            font-size: clamp(14px, 3.5vw, 16px);
            transition: all 0.3s ease;
        }

        .status.success {
            background-color: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .status.error {
            background-color: rgba(244, 67, 54, 0.2);
            color: #F44336;
        }

        .status.pending {
            background-color: rgba(255, 193, 7, 0.2);
            color: #FFC107;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @media (max-height: 600px) {
            .container {
                padding: 15px;
            }

            .unlock-button {
                width: min(150px, 40vw);
                height: min(150px, 40vw);
            }

            .title {
                margin-bottom: 15px;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .container {
                display: flex;
                align-items: center;
                gap: 20px;
                padding: 20px;
            }

            .title {
                margin-bottom: 0;
                flex: 1;
            }

            .unlock-button {
                margin: 0;
                width: min(120px, 30vh);
                height: min(120px, 30vh);
            }

            .status {
                flex: 1;
                margin-top: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="title">Smart Access Control</h1>
        <button class="unlock-button" onclick="unlock()">
            <i class="ri-lock-unlock-line"></i>
            <span>UNLOCK</span>
        </button>
        <div class="status" id="statusMessage">System Ready</div>
    </div>

    <script>
        // Prevent double-tap zoom on iOS
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        function unlock() {
            const statusMessage = document.getElementById('statusMessage');
            const unlockButton = document.querySelector('.unlock-button');

            // Add visual feedback and update status
            unlockButton.classList.add('pulse');
            statusMessage.className = 'status pending';
            statusMessage.textContent = 'Sending Unlock Signal...';

            // Add haptic feedback if available
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(100);
            }

            const requestData = {
                topic: "home/door/commands",
                type: 2,
                payload: "unlock",
                expiry_interval: 5,
                retained: false
            };

            fetch('https://flespi.io/mqtt/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'FlespiToken Nn3S9EZ9GK36SmzltonSaqHewBcOo1yHXrM4fe1jD36xpUcqtaNmTk0fCBzoHqGt'
                },
                body: JSON.stringify(requestData)
            })
                .then(response => {
                    unlockButton.classList.remove('pulse');
                    if (response.ok) {
                        statusMessage.className = 'status success';
                        statusMessage.textContent = 'Access Granted!';
                        if (window.navigator && window.navigator.vibrate) {
                            window.navigator.vibrate([100, 50, 100]);
                        }
                        setTimeout(() => {
                            statusMessage.className = 'status';
                            statusMessage.textContent = 'System Ready';
                        }, 3000);
                    } else {
                        statusMessage.className = 'status error';
                        statusMessage.textContent = 'Access Denied. Please Try Again.';
                        if (window.navigator && window.navigator.vibrate) {
                            window.navigator.vibrate([200, 100, 200]);
                        }
                    }
                })
                .catch(error => {
                    unlockButton.classList.remove('pulse');
                    statusMessage.className = 'status error';
                    statusMessage.textContent = 'Network Error. Please Try Again.';
                    console.error('Error:', error);
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate([200, 100, 200]);
                    }
                });
        }
    </script>
</body>

</html>
