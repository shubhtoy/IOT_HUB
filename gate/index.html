<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unlock System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #121420;
            --bg-secondary: #1E2133;
            --accent-color: #4A90E2;
            --text-color: #E0E0E0;
            --hover-color: #5CA0F6;
            --active-color: #3A7BD5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        .unlock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
            text-align: center;
        }

        .unlock-button {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--accent-color), var(--active-color));
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.2),
                0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            overflow: hidden;
            outline: none;
        }

        .unlock-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                circle at center, 
                rgba(255,255,255,0.1) 0%, 
                transparent 70%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .unlock-button:hover::before {
            opacity: 1;
        }

        .unlock-button:active {
            transform: scale(0.95);
            box-shadow: 
                0 10px 25px rgba(0,0,0,0.2),
                0 3px 10px rgba(0,0,0,0.1);
        }

        .status-message {
            color: var(--text-color);
            font-size: 1rem;
            opacity: 0.7;
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .unlock-button {
                width: 200px;
                height: 200px;
                font-size: 1.2rem;
            }
        }

        @media (max-height: 700px) {
            .unlock-button {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="unlock-container">
        <button class="unlock-button" onclick="unlock()">
            <i class="ri-lock-unlock-line" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem;"></i>
            <span style="position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);">UNLOCK</span>
        </button>
        <div class="status-message" id="statusMessage">Waiting for Command</div>
    </div>

    <script>
        function unlock() {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = 'Sending Pulse...';
            statusMessage.style.color = '#FFD700';

            const requestData = {
                topic: "home/door/commands",
                type: 2,
                payload: "unlock"
            };

            fetch('https://flespi.io/mqtt/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'FlespiToken BurdKkJDYyOKniFsCTOD97VY0m6us7pCnhSLhwnKqaMa6dt4jtXVOli3UHtZLnt5'
                },
                body: JSON.stringify(requestData)
            })
            .then(response => {
                if (response.ok) {
                    statusMessage.textContent = 'Gate Unlocked Successfully!';
                    statusMessage.style.color = '#4CAF50';
                } else {
                    statusMessage.textContent = 'Unlock Failed. Retry.';
                    statusMessage.style.color = '#FF6347';
                }
            })
            .catch(error => {
                statusMessage.textContent = 'Network Error';
                statusMessage.style.color = '#FF6347';
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
